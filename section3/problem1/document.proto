syntax = "proto3";

package collabdoc;

// Multi-user collaborative document service.
//
// Documents live in server memory.  Any client may create, read and edit a
// document; clients that have subscribed to a document receive its full new
// content over a server-streaming RPC every time it changes.
service DocumentService {
  // Creates a new document.  Fails with ALREADY_EXISTS if the name is taken.
  rpc CreateDocument(CreateDocumentRequest) returns (CreateDocumentResponse);

  // Returns the current content of a document.  NOT_FOUND if it does not exist.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

  // Inserts `text` at character offset `position`.  OUT_OF_RANGE if the
  // position is past the end of the document, NOT_FOUND if the document does
  // not exist.  The response carries the content *after* this edit.
  rpc EditDocument(EditDocumentRequest) returns (EditDocumentResponse);

  // Server-streaming subscription.  The first message is a snapshot of the
  // document as it stands (snapshot = true), so the subscriber is in sync from
  // the moment the stream is live; then one DocumentUpdate per committed edit
  // until the client cancels.
  rpc SubscribeToUpdates(UpdateRequest) returns (stream DocumentUpdate);
}

message CreateDocumentRequest {
  string name = 1;
  string initial_content = 2;
}

message CreateDocumentResponse {
  string name = 1;
  string message = 2;
}

message GetDocumentRequest {
  string name = 1;
}

message GetDocumentResponse {
  string name = 1;
  string content = 2;
  // Monotonically increasing per-document edit counter.  Lets a client tell
  // whether an update it receives is newer than what it last displayed.
  uint64 version = 3;
}

message EditDocumentRequest {
  string name = 1;
  uint32 position = 2;
  string text = 3;
  // Optional identity for the audit trail carried in DocumentUpdate.
  string client_id = 4;
}

message EditDocumentResponse {
  string name = 1;
  string content = 2;
  uint64 version = 3;
}

message UpdateRequest {
  string name = 1;
  string client_id = 2;
}

message DocumentUpdate {
  string name = 1;
  string content = 2;
  uint64 version = 3;
  // Who made the edit that produced this version, and what they inserted.
  string edited_by = 4;
  uint32 position = 5;
  string inserted_text = 6;
  // True for the initial message sent right after subscribing (current
  // content, no edit behind it).
  bool snapshot = 7;
}
